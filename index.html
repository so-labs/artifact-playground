<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Artifact Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#2563eb" id="theme-color-meta">
    <script>
        (function () {
            try {
                var lang = localStorage.getItem('app-lang') || (navigator.language && navigator.language.toLowerCase().startsWith('ja') ? 'ja' : 'en');
                document.documentElement.setAttribute('lang', lang);

                var theme = localStorage.getItem('app-theme') || 'system';
                var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                var metaThemeColor = document.getElementById('theme-color-meta');
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    if (metaThemeColor) metaThemeColor.setAttribute('content', '#0f172a');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    if (metaThemeColor) metaThemeColor.setAttribute('content', '#ffffff');
                }

                // 描画前にサイドバーの折りたたみ状態を判定して適用（チラつき防止）
                var sidebarCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
                if (sidebarCollapsed && window.innerWidth > 768) {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <header class="app-header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-toggle" aria-label="メニューを開く" data-i18n-aria="header.menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <button id="sidebar-toggle" class="sidebar-toggle" aria-label="サイドバーを折りたたむ" data-i18n-aria="header.sidebarToggle">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1><a href="#home" style="color: inherit; text-decoration: none;">Artifact Playground</a></h1>
        </div>
    </header>

    <div class="app-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <nav>
                    <ul id="tool-list" class="tool-list">
                        <!-- JSで動的に追加されます -->
                    </ul>
                </nav>
            </div>
            <div class="sidebar-footer">
                <button id="theme-settings-btn" class="settings-btn" aria-label="テーマ設定" data-i18n-aria="menu.themeSettings">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round" class="settings-icon">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
                <button id="system-menu-btn" class="settings-btn" aria-label="開発・システム機能" data-i18n-aria="menu.systemSettings">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 2v7.5M14 2v7.5M8.5 2h7M14 11.5L19 21H5l5-9.5"></path>
                    </svg>
                </button>
                <div id="theme-menu" class="theme-menu">
                    <ul>
                        <li class="theme-menu-submenu-item">
                            <button id="lang-submenu-toggle" class="theme-submenu-header" aria-expanded="false">
                                <div class="menu-item-label-group">
                                    <span class="menu-item-title" data-i18n="menu.lang">言語</span>
                                    <span class="menu-item-desc" data-i18n="menu.langDesc">表示言語の切り替え</span>
                                </div>
                                <span class="theme-current-label">
                                    <span id="current-lang-name">日本語</span>
                                    <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16"
                                        stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </span>
                            </button>
                            <ul id="lang-submenu-list" class="theme-submenu-list">
                                <li><button class="lang-option" data-value="en">English</button></li>
                                <li><button class="lang-option" data-value="ja">日本語</button></li>
                            </ul>
                        </li>
                        <li class="theme-menu-separator"></li>
                        <li class="theme-menu-section-item">
                            <div class="menu-item-label-group">
                                <span class="menu-item-title" data-i18n="menu.theme">テーマ</span>
                                <span class="menu-item-desc" data-i18n="menu.themeDesc">アプリの外観切り替え</span>
                            </div>
                            <div class="theme-toggle-group" id="theme-toggle-group" role="radiogroup" aria-label="テーマ" data-i18n-aria="menu.theme">
                                <button type="button" class="theme-toggle-btn" data-value="light" role="radio" aria-checked="false">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                                    <span data-i18n="theme.light">ライト</span>
                                </button>
                                <button type="button" class="theme-toggle-btn" data-value="system" role="radio" aria-checked="false">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 0 20Z" fill="currentColor"></path></svg>
                                    <span data-i18n="theme.system">システム</span>
                                </button>
                                <button type="button" class="theme-toggle-btn" data-value="dark" role="radio" aria-checked="false">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                                    <span data-i18n="theme.dark">ダーク</span>
                                </button>
                            </div>
                        </li>
                        <li class="theme-menu-separator"></li>
                        <li class="theme-menu-toggle-item">
                            <div class="menu-item-label-group">
                                <span class="menu-item-title" data-i18n="menu.tempMode">一時モード</span>
                                <span class="menu-item-desc" data-i18n="menu.tempModeDesc">閉じた時に消去（既存データは保持）</span>
                            </div>
                            <button id="temp-mode-toggle" class="toggle-switch" role="switch" aria-checked="false"
                                aria-label="一時モードのオンオフ" data-i18n-aria="menu.tempModeAria">
                                <span class="toggle-thumb"></span>
                            </button>
                        </li>
                        <li class="theme-menu-toggle-item">
                            <div class="menu-item-label-group">
                                <span class="menu-item-title" data-i18n="menu.primaryAnimate">プライマリーカラー切替</span>
                                <span class="menu-item-desc" data-i18n="menu.primaryAnimateDesc">アクセントの色を自動アニメーション</span>
                            </div>
                            <button id="primary-animate-toggle" class="toggle-switch" role="switch" aria-checked="true"
                                aria-label="プライマリーカラー切替のオンオフ" data-i18n-aria="menu.primaryAnimateAria">
                                <span class="toggle-thumb"></span>
                            </button>
                        </li>
                    </ul>
                </div>
                <div id="system-menu" class="theme-menu system-menu">
                    <ul>
                        <li>
                            <a href="#test-runner" class="theme-option" style="display: block; text-decoration: none;">
                                <div class="menu-item-label-group">
                                    <span class="menu-item-title" data-i18n="menu.runTests">テストを実行</span>
                                    <span class="menu-item-desc" data-i18n="menu.runTestsDesc">単体テストランナー画面を開く</span>
                                </div>
                            </a>
                        </li>
                        <li class="theme-menu-separator"></li>
                        <li>
                            <button id="clear-data-btn" class="theme-option text-danger">
                                <div class="menu-item-label-group">
                                    <span class="menu-item-title" data-i18n="menu.clearData">ローカルデータ全削除</span>
                                    <span class="menu-item-desc" data-i18n="menu.clearDataDesc">全ツールの保存データ・設定を初期化</span>
                                </div>
                            </button>
                        </li>
                        <li class="theme-menu-separator"></li>
                        <li>
                            <div class="menu-item-label-group"
                                style="padding: 0.5rem 1rem; opacity: 0.6; text-align: center;">
                                <span class="menu-item-desc" id="app-version-display"
                                    style="font-family: 'Fira Code', monospace;">Ver ---</span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <section id="tool-home" class="home-section active">
                <div class="home-header">
                    <h2 data-i18n="home.welcome">ようこそ</h2>
                    <p data-i18n="home.desc">サイドバーまたは下のタイルからツールを選んでください。</p>
                </div>
                <div class="home-tiles" id="home-tiles">
                    <!-- JSで動的に追加されます -->
                </div>
            </section>
            <!-- ツールが動的に読み込まれます -->
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
